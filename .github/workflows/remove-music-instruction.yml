name: Remove Music Instruction

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  remove-instruction:
    if: ${{ !contains(github.event.head_commit.message, '[skip music instruction]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove music instruction from index
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<br><span style="font-size:.82rem">🎵 Add <b>music.mp3</b> to this folder for background music.</span>'
          s = s.replace(old, '')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Remove music instruction [skip music instruction]'
          git push
