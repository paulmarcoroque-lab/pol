<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pol 💗</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#3e3940;min-height:100vh;background:linear-gradient(125deg,#ffd4e5,#f5b3cd,#b9e7dc,#e5faf5,#ffd4e5);background-size:400% 400%;animation:bg 16s ease infinite} @keyframes bg{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}.screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px}.card{width:min(760px,96%);padding:34px 26px;background:#ffffffdf;backdrop-filter:blur(16px);border-radius:30px;box-shadow:0 20px 60px #4d394533;text-align:center}.hidden{display:none!important}h1,h2{margin:12px 0}h1{font-size:clamp(2.2rem,7vw,4.8rem);line-height:1;color:#d66e99}h2{font-size:clamp(1.7rem,5vw,2.7rem)}p{line-height:1.6;color:#667078}.btn{border:0;border-radius:999px;padding:14px 22px;margin:7px;background:linear-gradient(135deg,#ed82aa,#62bda9);color:#fff;font-weight:700;cursor:pointer}.btn:disabled{opacity:.5}.choices{display:grid;gap:12px;margin-top:18px}.choice{border:2px solid transparent;background:#fff;padding:16px 18px;border-radius:18px;text-align:left;font-size:1rem;cursor:pointer;box-shadow:0 5px 18px #3331}.choice:hover{border-color:#6bc3b1}.choice.locked{border-color:#6bc3b1;background:#f0fbf8}.barwrap{height:9px;background:#eee5e9;border-radius:99px;overflow:hidden;margin:12px 0 22px}.bar{height:100%;width:0;background:linear-gradient(90deg,#ed82aa,#62bda9);transition:.3s}.response{margin:20px 0;padding:20px;border-radius:22px;background:linear-gradient(135deg,#fff0f6,#e8faf5);font-size:1.05rem;line-height:1.6}.response strong{color:#d66e99}.lockednote{font-size:.8rem;color:#8b777f}textarea{width:100%;min-height:120px;padding:15px;border:2px solid #eadfe5;border-radius:18px;font:inherit;resize:vertical;outline:0}textarea:focus{border-color:#68bfaf}.photo{width:min(330px,90%);border-radius:25px;margin:25px auto;display:block;box-shadow:0 18px 45px #3334}.envelope{margin:25px auto;width:250px;height:150px;border-radius:18px;background:linear-gradient(135deg,#f3a1bd,#67c3b0);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold;box-shadow:0 15px 35px #3332}.summary{text-align:left;max-height:280px;overflow:auto;background:#fff;padding:15px;border-radius:18px}.summary p{margin:8px 0;font-size:.92rem}.small{letter-spacing:2px;text-transform:uppercase;color:#568d83;font-size:.8rem;font-weight:bold}</style></head><body><section id="intro" class="screen"><div class="card"><div class="small">✨ a very serious invitation ✨</div><div class="envelope">open me hehe 💌</div><h1>HI<br>HAHAHAHAHAHAHAHA</h1><p>May itatanong lang ako... promise, mabilis lang HAHAHA.</p><button class="btn" onclick="start()">OPEN THE QUESTIONNAIRE 💗</button></div></section><section id="quiz" class="screen hidden"><div class="card"><div id="count" class="small"></div><div class="barwrap"><div id="bar" class="bar"></div></div><p class="lockednote">⚠️ Once you choose an answer, locked na siya and hindi na puwedeng palitan.</p><h2 id="question"></h2><div id="choices" class="choices"></div><textarea id="text" class="hidden" placeholder="Type your answer here..."></textarea><button id="submitText" class="btn hidden" onclick="textAnswer()">Submit answer</button><div id="response" class="response hidden"></div><button id="next" class="btn hidden" onclick="nextQuestion()">Next →</button></div></section><section id="finish" class="screen hidden"><div class="card"><div class="small">questionnaire complete ✨</div><h2>HAHAHA thank you for answering 😭💗</h2><div id="summary" class="summary"></div><button class="btn" onclick="sendAnswers()">SUBMIT ANSWERS ✉️</button><div id="status" class="response hidden"></div><hr style="border:0;border-top:1px solid #eadfe5;margin:30px 0"><p>Ako nga pala gumawa nito hehehe.</p><img class="photo" src="./paul.jpg" alt="Paul"></div></section><script>const questions=[
{q:'Kumusta ka lately?',c:['Okay lang','Hindi okay'],r:{'Okay lang':()=>pick(['Yayyy, good to know na okay ka! Sana tuloy-tuloy lang yung good vibes mo today. 💗','Awww nice, masaya akong okay ka. Keep that smile HAHAHA 🌸','Good to know! At least may isang magandang balita today 😭💗']),'Hindi okay':()=>`Pray ka lang palagi. “Do not worry, your heavenly Father knows what you need.” — Matthew 6:31–32 🙏💗`}},
{q:'May crush ka ba ngayon?',c:['MERON','WALA','NOT READY'],r:{'MERON':()=>pick(['AY AWTS 😭 HAHAHA. So may someone pala. Sana worth it siya ah.','Ohhh may crush! 😭 Medyo masakit pero okay lang, support ako HAHAHA.','MAY CRUSH 😭💔 noted... I will respectfully pretend I am okay HAHAHA.']),'WALA':()=>pick(['HAHAHA good to know! Peaceful era muna? 😌🌿','Wala? Nice, less stress HAHAHA. Enjoy muna! 💗','Ay wala pala 😭 HAHAHA okay, happy for you!']),'NOT READY':()=>pick(['Valid yan. Hindi naman kailangang madaliin ang feelings. “There is a time for everything.” — Ecclesiastes 3:1 💗','Take your time. Darating din yung tamang panahon. 🌷','No pressure. Focus muna sa sarili and sa mga bagay na mahalaga sa iyo. 🙏'])}},
{q:'Anong type mo sa lalaki?',c:['Simple lang','Mabait na Funny','IT DEPENDS'],text:true,r:{'Simple lang':()=>pick(['Simple lang pero baka complicated pala sa loob HAHAHA 😭','Practical choice! Hindi kailangan ng sobrang extra, basta genuine. 🌷','Simple lang? Noted. Lowkey pero may substance ang hanap. 😌']),'Mabait na Funny':()=>pick(['Mabait at funny? So kailangan pala may good personality AND comedy skills HAHAHA. 😂','Okay, kindness plus humor. Actually solid combination yan. 💗','Ayan, may standard! Mabait na, funny pa—dangerous combination HAHAHA. 😭'])}},
{q:'Ano first impression mo sa akin?',text:true,r:{}},
{q:'Kung makikipag-date ka, anong date ang gusto mo?',c:['Coffee date','Movie date','Food trip','Long walk + kwentuhan'],r:{'Coffee date':()=>pick(['Coffee date? Ayay, acidic akoooo ☕😭 Pero cute naman.','Coffee date noted! Sana hindi puro kape ang kwentuhan HAHAHA. ☕💗']),'Movie date':()=>pick(['Movie date? Spiderman? 🕷️ HAHAHA.','Movie date sounds chill. Basta wag matulog sa gitna 😭🍿']),'Food trip':()=>pick(['Food trip! Baka tumaba ako—pero worth it siguro HAHAHA 😭🍜','Food trip is a dangerous but beautiful choice. 😂🍴']),'Long walk + kwentuhan':()=>pick(['Nice choice. Simple pero masarap yung mahaba-habang kwentuhan. 🌷','Long walk + kwentuhan? That actually sounds peaceful. 💗'])}},
{q:'If someone likes you, gusto mo bang malaman?',c:['YES','MAYBE','HINDI'],r:{'YES':()=>pick(['YES agad HAHAHA 😭 Diretso tayo!','At least gusto mong malaman. Transparency era 😭💗']),'MAYBE':()=>pick(['Hmmmm MAYBE? Nag-iisip pa talaga oh 👀','Maybe... suspicious answer HAHAHA. 🤔']),'HINDI':()=>pick(['ARAYMOPAKAKKWEKKWEK 😭 Respectfully, noted.','HINDI? Ouch pero okay lang HAHAHA 😭'])}},
{q:'Would you give someone a chance kahit hindi mo siya expected magustuhan?',c:['YES','NO','DEPENDE SA TAO'],text:true,r:{'YES':()=>pick(['Awww open-minded! 🌸 Sometimes unexpected people become meaningful.','YES? That is actually a hopeful answer. 💗']),'NO':()=>pick(['NO 😭 HAHAHA at least honest. Respectfully, goodbye sa pag-asa.','Malungkot pero funny HAHAHA 😭 At least clear!']),'DEPENDE SA TAO':()=>pick(['Fair answer. Personality really can change how you see someone. 🌷','Depende sa tao—reasonable. Hindi naman kasi one-size-fits-all ang feelings. 💗'])}},
{q:'May chance ba ako sa’yo?',c:['OO NAMAN','WALA, SORRY'],text:true,r:{'OO NAMAN':()=>pick(['AY WAIT LANG 😭💗 HIGHLY MOTIVATED TULOY HAHAHA!','OO NAMAN?! 😭 Okay, noted. Suddenly motivated ako mag-aral HAHAHA.','HAHAHA thank you sa confidence boost! 🥹💗']),'WALA, SORRY':()=>`It’s okay. Your life, your choice. 💗 “Let all that you do be done in love.” — 1 Corinthians 16:14 🙏`}},
{q:'Joke, eto na ang last talaga! Rate mo ’tong ginawa ko ahahahaha',c:['10/10','8/10','0/10'],r:{'10/10':()=>`Galing ko talaga 😎💗`, '8/10':()=>`Corny kasi, no? 😭 HAHAHA pero 8/10 is still a win.`, '0/10':()=>`KINILIG KA LANG E 😭 HAHAHAHAHA.`}}
];let i=0,answers=[];function pick(a){return a[Math.floor(Math.random()*a.length)]}function start(){document.getElementById('intro').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');render()}function render(){let x=questions[i];document.getElementById('count').textContent=`QUESTION ${i+1} OF ${questions.length}`;document.getElementById('bar').style.width=((i+1)/questions.length*100)+'%';document.getElementById('question').textContent=x.q;document.getElementById('choices').innerHTML='';document.getElementById('response').classList.add('hidden');document.getElementById('next').classList.add('hidden');let ta=document.getElementById('text');ta.value='';ta.disabled=false;ta.classList.toggle('hidden',!x.text);document.getElementById('submitText').classList.toggle('hidden',!x.text);if(x.c)x.c.forEach(c=>{let b=document.createElement('button');b.className='choice';b.textContent=c;b.onclick=()=>choose(c,b);document.getElementById('choices').appendChild(b)})}function choose(answer,button){if(answers[i])return;answers[i]={answer};document.querySelectorAll('.choice').forEach(b=>b.disabled=true);button.classList.add('locked');showResponse(makeResponse(answer));document.getElementById('next').classList.remove('hidden')}function textAnswer(){if(answers[i])return;let t=document.getElementById('text').value.trim();if(!t)return;answers[i]={answer:t};document.getElementById('text').disabled=true;document.getElementById('submitText').disabled=true;showResponse(makeTextResponse(t,i));document.getElementById('next').classList.remove('hidden')}function makeResponse(a){let x=questions[i];if(a==='IT DEPENDS'&&x.text)return 'Sige, explain mo nga. 👀';return x.r&&x.r[a]?x.r[a]():pick(['Interesting answer HAHAHA. 👀','Noted! Thank you sa honest answer. 💗','Hmmmm, I see. Interesting... 🤔'])}function makeTextResponse(t,n){let s=t.toLowerCase();if(n===2){if(/mabait|kind|nice|funny|humor|respect|respectful|loyal|honest|caring|maalaga/.test(s))return 'Okay, gets ko. Mukhang personality talaga ang importante sa iyo. Good answer—may substance. 🌷';if(/simple|simplicity|lowkey|quiet/.test(s))return 'So simple and genuine ang hanap mo. Noted HAHAHA. 😌💗';if(/looks|gwapo|handsome|height|matangkad/.test(s))return 'HAHAHA noted! At least honest ka sa preferences mo. 👀';return 'Hmmmm, interesting. So may sarili kang reason sa type mo. I respect that. 🤔💗'}if(n===3){if(/mabait|kind|nice|friendly|approachable|funny|kulit|funny|humble/.test(s))return pick(['HAHAHA so mabait/funny/approachable pala ang first impression mo sa akin 😭 At least hindi masama!','Awww, okay yan ah. Salamat sa honest first impression mo. 💗']);if(/mayabang|arrogant|masungit|suplado|annoying|makulit/.test(s))return pick(['AY MAYABANG AGAD? 😭 HAHAHA okay, noted. I will improve my reputation.','HAHAHA ang sakit pero at least honest ka 😭']);if(/quiet|tahimik|shy|mahiyain/.test(s))return 'Tahimik agad? 😭 HAHAHA pero baka shy lang talaga ako sa first impression. 💗';return 'Hmmmm, interesting first impression. 👀 Salamat sa pagiging honest—at least alam ko na kung paano mo ako unang nakita HAHAHA.'}if(n===6){if(/yes|oo|chance|give|open|try/.test(s))return 'Awww, open-minded answer. 🌸 Minsan talaga unexpected people can surprise us.';if(/no|hindi|never/.test(s))return 'Okay, clear HAHAHA 😭 At least honest. Respect sa answer mo.';return 'Interesting... so may factors talaga bago ka magbigay ng chance. Fair enough. 🤔'}if(n===7){if(/oo|yes|maybe|meron|chance|possibly|siguro/.test(s))return pick(['WAIT 😭💗 So may possibility pala? Highly motivated tuloy HAHAHA!','Okay... that answer gave me a little hope HAHAHA 😭💗']);if(/wala|no|hindi|sorry/.test(s))return 'It’s okay, your life, your choice. 💗 I respect your honesty.';return 'Hmmmm... mysterious answer. 👀 I guess I will take that as a “let me think” HAHAHA.'}return 'Interesting answer HAHAHA. Thank you for being honest. 💗'}function showResponse(t){let r=document.getElementById('response');r.innerHTML=t;r.classList.remove('hidden');r.classList.add('live');setTimeout(()=>r.classList.remove('live'),350)}function nextQuestion(){if(!answers[i])return;if(i<questions.length-1){i++;render()}else finish()}function finish(){document.getElementById('quiz').classList.add('hidden');document.getElementById('finish').classList.remove('hidden');document.getElementById('summary').innerHTML=answers.map((a,n)=>`<p><strong>${n+1}. ${questions[n].q}</strong><br>${escapeHtml(a.answer)}</p>`).join('')}function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}async function sendAnswers(){let status=document.getElementById('status');status.classList.remove('hidden');status.textContent='Sending... 💌';let data={_subject:'Pol Questionnaire Response',_replyto:'',answers:answers.map((a,n)=>`${n+1}. ${questions[n].q}\nAnswer: ${a.answer}`).join('\n\n')};try{let res=await fetch('https://formspree.io/f/xaewjypl',{method:'POST',headers:{'Accept':'application/json','Content-Type':'application/json'},body:JSON.stringify(data)});if(res.ok)status.textContent='Sent successfully! 💗 Thank you!';else throw new Error()}catch(e){status.textContent='Hindi na-send ngayon. Please try again. 😭'}}</script></body></html>
